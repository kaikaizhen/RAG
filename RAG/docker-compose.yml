version: "3.9"

services:
  rag:
    build:
      context: .              # Dockerfile 所在目錄
      additional_contexts:
        # 共用 Library 原始碼（不經 NuGet）；路徑於 .env 以 LIBRARY_PATH 設定
        library: ${LIBRARY_PATH:-../../Library}
    image: rag                # 建構後的映像名稱
    container_name: rag       # 容器名稱
    ports:
      - "8006:8006"           # 主機:容器 port 映射
    environment:
      # 以環境變數覆寫 appsettings，避免將機敏資訊寫進版控
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      RagOption__BaseUrl: ${RAG_SERVER_BASE_URL}
      # 與 RAG_Server 的 INTERNAL_API_KEY 相同；只放在未納版控的 .env
      RagOption__InternalApiKey: ${RAG_INTERNAL_API_KEY}
      # 與 RAG_Server 共用同一組校準值（同名 env 由 .env 同時注入兩個服務）
      ContextRuntime__EvidenceScoreThreshold: ${DIRECT_MATCH_THRESHOLD:-0.70}
      ContextRuntime__SimilarScoreThreshold: ${SIMILAR_SCORE_THRESHOLD:-0.50}
    restart: unless-stopped   # 自動重啟策略
