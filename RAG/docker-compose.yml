version: "3.9"

services:
  rag:
    build:
      context: .              # Dockerfile 所在目錄
      network: host           # 若建構過程需要使用主機網路
      args:
        # 私有 NuGet 來源，請於 .env 設定 NUGET_PRIVATE_FEED
        NUGET_PRIVATE_FEED: ${NUGET_PRIVATE_FEED}
    image: rag                # 建構後的映像名稱
    container_name: rag       # 容器名稱
    ports:
      - "8006:8006"           # 主機:容器 port 映射
    environment:
      # 以環境變數覆寫 appsettings，避免將機敏資訊寫進版控
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      RagOption__BaseUrl: ${RAG_SERVER_BASE_URL}
    restart: unless-stopped   # 自動重啟策略
